name: Dev Branch Build and Publish

on:
  push:
    branches:
      - dev

jobs:
  ssh-login-test:
    name: SSH Login Test
    runs-on: ubuntu-latest

    steps:
      - name: SSH Login
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2002 1.14.103.234 >> ~/.ssh/known_hosts
      - name: Do Action
        run: ssh -p 2002 usr1@1.14.103.234 "your_deploy_command"
      


